services:
  redis:
    image: cartura-redis:8
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    volumes:
      - cartura_redis_data:/data

volumes:
  cartura_redis_data:
